name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cek:
    name: Tes, build, dan kontras
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Siapkan Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pasang dependensi
        run: npm ci
      - name: Jalankan tes
        run: npm test
      - name: Tipe check dan build
        run: npm run build
      - name: Periksa kontras
        run: node scripts/contrast.mjs
