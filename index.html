<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tongkrongan.tech | Subdomain gratis untuk semua orang</title>
    <meta name="description" content="Klaim nama.tongkrongan.tech gratis, sambungkan ke Cloudflare, Railway, Vercel, VPS atau hosting biasa dalam hitungan menit." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      try {
        var t = localStorage.getItem('tt.theme');
        if (t) document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('tt.lang');
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
